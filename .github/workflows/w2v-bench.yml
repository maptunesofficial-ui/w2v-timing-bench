name: w2v-bench
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: python deps (pinned)
        run: python3 -m venv v && ./v/bin/pip install -q torch==2.5.1 transformers==4.46.3 onnx==1.17.0 numpy==1.26.4
      - name: public clip and vocab
        run: |
          mkdir -p Resources
          curl -fL -o jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          curl -fL -o vocab_base.json https://huggingface.co/facebook/wav2vec2-base-960h/resolve/main/vocab.json
      - name: export onnx (fixed 6 s input)
        run: ./v/bin/python export.py
      - name: size
        run: ls -la Resources
      - name: project
        run: |
          brew install xcodegen
          xcodegen
      - name: build unsigned
        run: xcodebuild -project W2VBench.xcodeproj -scheme W2VBench -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath dd build | tail -40
      - name: ipa
        run: |
          mkdir Payload && cp -R dd/Build/Products/Release-iphoneos/W2VBench.app Payload/ && zip -qry W2VBench.ipa Payload && ls -la W2VBench.ipa
      - uses: actions/upload-artifact@v4
        with: { name: W2VBench-ipa, path: W2VBench.ipa, compression-level: 0 }

name: W2VBench
options:
  bundleIdPrefix: org.w2vbench
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
packages:
  ORT:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.20.0
targets:
  W2VBench:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.w2vbench.app
        INFOPLIST_KEY_CFBundleDisplayName: W2VBench
    dependencies:
      - package: ORT
        product: onnxruntime
